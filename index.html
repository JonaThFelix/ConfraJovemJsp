<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3bd18">
<meta name="color-scheme" content="light">
<title>CONFRA JOVEM JSP 2026 · Controle de convidados</title>
<style>
:root{--yellow:#f3bd18;--yellow-lite:#fff3c2;--ink:#201c12;--muted:#6c6657;--line:#e9e1cc;--page:#faf8f2;--paper:#fff;--green:#167145;--red:#b42327;--shadow:0 2px 11px rgba(28,25,17,.045)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--page);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);font-size:15px;line-height:1.43}
button,input,textarea{font:inherit}button{cursor:pointer;touch-action:manipulation}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid #d49100;outline-offset:2px}input,textarea{appearance:none;-webkit-appearance:none;width:100%;min-width:0;min-height:48px;padding:12px 13px;background:#fff;border:1.5px solid #d5cdbb;border-radius:11px;color:var(--ink);font-size:16px}input:focus,textarea:focus{border-color:#b98700;outline:2px solid #ffd866;outline-offset:0}input::placeholder,textarea::placeholder{color:#908a7e}textarea{min-height:110px;resize:vertical}
button{border:0;border-radius:11px;min-height:44px;font-size:14px;font-weight:740;padding:10px 16px}button.primary{background:var(--yellow);color:var(--ink)}button.dark{background:var(--ink);color:#fff}button.soft{background:#f4f0e6;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff6f6;color:var(--red);border:1px solid #f2c4c4}button.small{min-height:41px;font-size:13px;padding:8px 12px}
.wrap{width:min(100% - 28px,790px);margin:0 auto;padding:14px 0 38px}.hero{display:flex;gap:13px;align-items:center;background:linear-gradient(115deg,#ffdf62 0%,#f3bd18 72%);border-radius:16px;padding:13px 15px;min-height:96px;box-shadow:var(--shadow)}.hero img{height:67px;width:67px;object-fit:contain;flex-shrink:0}.hero h1{font-size:clamp(18px,4.7vw,25px);line-height:1.13;margin:0;letter-spacing:-.5px;font-weight:870}.hero p{font-size:13px;margin:5px 0 0;font-weight:650}.storage{display:flex;align-items:center;gap:7px;margin:12px 2px 13px;color:var(--muted);font-size:12px;flex-wrap:wrap}.dot{width:7px;height:7px;border-radius:50%;background:#168a52;display:inline-block}.storage strong{color:#4c463a}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;margin:0 0 16px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:12px 11px;min-height:78px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:23px;line-height:1.1;letter-spacing:-.5px;word-break:break-word}.stat span{display:block;font-size:12px;line-height:1.2;color:var(--muted);margin-top:5px}.stat.highlight{background:#fff0ad;border-color:#f0d46c}.stat.money-stat strong{font-size:clamp(16px,3.6vw,22px)}.stat-note{grid-column:1/-1;margin:0 3px;color:var(--muted);font-size:12px;line-height:1.35}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:15px}.tabs button{border:1px solid var(--line);background:var(--paper);color:#676050;font-size:14px;font-weight:780}.tabs button.active{background:var(--ink);border-color:var(--ink);color:white}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:16px;margin-bottom:13px;box-shadow:var(--shadow)}h2{font-size:20px;letter-spacing:-.4px;margin:0 0 5px}h3{font-size:16px;margin:0 0 10px}.sub{font-size:13px;color:var(--muted);margin:0 0 15px}.label{display:block;color:#4c463a;font-size:13px;font-weight:720;margin-bottom:6px}.field{margin:0 0 13px}.form-line{display:flex;align-items:end;gap:9px}.form-line .field{margin:0;flex:1}.form-line button{min-width:115px}.form-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:10px}.full{width:100%}.hint{font-size:12px;color:var(--muted);margin:8px 0 0}.search{margin:8px 0 12px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 8px}.count{font-size:12px;color:var(--muted);font-weight:670}.empty{padding:25px 13px;text-align:center;border:1px dashed #d8cdb9;border-radius:12px;color:var(--muted);background:#fdfbf8;margin:10px 0}
.person{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:8px;padding:12px}.person-main{flex:1;min-width:150px}.person b{display:block;font-size:15px;line-height:1.25;overflow-wrap:anywhere}.details{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--muted)}.chip{display:inline-flex;border-radius:100px;padding:3px 8px;background:#f3f0e9;color:#575144;font-size:11px;font-weight:760;max-width:100%}.chip.ok{background:#e4f6e9;color:var(--green)}.chip.warn{background:#fff0cb;color:#94600a}.chip.extra{background:#ece7fc;color:#5844a0}.actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-left:auto}.actions .wrist{width:110px;min-height:43px;font-size:14px;padding:8px 9px}.alert{background:#fff4dc;border:1px solid #f0d793;padding:12px;border-radius:12px;margin-bottom:13px;font-size:13px;color:#5f4510}.notice{background:#f4f8ef;border:1px solid #dbe6ce;padding:12px;border-radius:12px;margin:12px 0;font-size:13px;color:#334d27}.checkbox-line{display:flex;gap:10px;align-items:center;font-size:14px;padding:3px 0;margin-bottom:13px}.checkbox-line input{appearance:auto;width:20px;height:20px;min-height:20px;flex:none;accent-color:#a97c00}.checkbox-line label{cursor:pointer}.divider{height:1px;background:var(--line);margin:16px 0}.extra-link{display:block;color:#654c00;font-weight:760;text-align:center;margin-top:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px;background:none;border:none;font-size:13px;min-height:35px}details{margin-top:13px}summary{cursor:pointer;color:#645a41;font-weight:700;font-size:13px;padding:8px 0}details .interior{padding:8px 0 0}
.footer{padding:3px 0 8px}.footer details{background:#fff;border:1px solid var(--line);padding:0 13px 12px;border-radius:12px;margin-top:0}.footer summary{padding:13px 0;font-size:14px}.backup-actions{display:flex;gap:8px;flex-wrap:wrap}.backup-actions button{flex:1;min-width:130px}.backup-note{font-size:12px;color:var(--muted);margin:8px 0}.sr-only{position:absolute;width:1px;height:1px;clip:rect(0,0,0,0);overflow:hidden;white-space:nowrap}.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);opacity:0;pointer-events:none;background:#211d15;color:#fff;border-radius:12px;padding:12px 16px;z-index:50;max-width:min(94vw,550px);width:max-content;box-shadow:0 9px 32px #0003;transition:opacity .2s,transform .2s;font-size:13px;text-align:center}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.toast.err{background:#96252a}
@media(max-width:620px){.wrap{width:calc(100% - 24px);padding-top:12px;padding-bottom:calc(106px + env(safe-area-inset-bottom))}.hero{min-height:86px;padding:11px 12px;gap:10px}.hero img{height:62px;width:62px}.stats{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px;margin-bottom:12px}.stat{padding:10px 11px;min-height:71px}.stat strong{font-size:21px}.stat.money-stat strong{font-size:20px}.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;margin:0;padding:8px 12px calc(8px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);box-shadow:0 -3px 18px #0000000a;gap:8px}.tabs button{min-height:53px;padding:7px 5px}.tabs button.active{background:var(--ink)}.panel{padding:14px 13px;border-radius:14px}.person{gap:10px}.actions{width:100%;margin-left:0}.actions .wrist{flex:1}.actions button{flex:1}.form-grid{grid-template-columns:1fr 1fr}.toast{bottom:calc(83px + env(safe-area-inset-bottom))}}
@media(max-width:360px){.hero h1{font-size:17px}.form-grid{grid-template-columns:1fr}.form-line{flex-direction:column;align-items:stretch}.form-line .field,.form-line button{width:100%}.person-main{min-width:0;flex-basis:100%}.actions button{font-size:12px;padding:8px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
const clean=s=>String(s||'').replace(/\s+/g,' ').trim();
const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const time=v=>{if(!v)return '';const d=new Date(v);return isNaN(d)?'':d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})};
const stamp=()=>new Date().toISOString();
const uniqueId=()=>typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():'jsp-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const KEY='confra-jovem-jsp-2026-v2';const INDEX_DB='confra-jovem-jsp-2026';
let guests=[],price=0,mode='local',remote=null,localState=null,dbOffline=null,tab='gate',gateQuery='',listQuery='',extQuery='',extraPrefill='',busy=false,toastTimer;
function parseAmount(value){let v=String(value??'').replace(/[^\d.,-]/g,'').trim();if(v.includes(','))v=v.replace(/\./g,'').replace(',','.');else if(/^\d{1,3}(\.\d{3})+$/.test(v))v=v.replace(/\./g,'');const x=Number(v);return Number.isFinite(x)&&x>=0?Math.round(x*100)/100:null}
function alertToast(msg,error=false){const el=$('#toast');clearTimeout(toastTimer);el.textContent=msg;el.className='toast show'+(error?' err':'');toastTimer=setTimeout(()=>{el.className='toast'},3900)}
function defaultState(){return {schema:2,updatedAt:Date.now(),guests:[],price:0}}
function normalizeState(raw){if(!raw||!Array.isArray(raw.guests))throw new Error('Os dados salvos estão danificados. Importe um backup para recuperar seus convidados.');return {schema:2,updatedAt:Number(raw.updatedAt)||0,price:Number(raw.price)||0,guests:raw.guests.filter(g=>g&&typeof g.name==='string'&&g.name.trim()).map(g=>({...g,id:String(g.id||uniqueId()),name:clean(g.name),type:g.type==='excedente'?'excedente':'confirmado',amount:Number(g.amount)||0,paid:!!g.paid,checkedInAt:g.checkedInAt||null,wristband:typeof g.wristband==='string'?g.wristband:''}))}}
function idbOpen(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB indisponível'));const req=indexedDB.open(INDEX_DB,1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains('data'))req.result.createObjectStore('data')};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
function idbGet(db){return new Promise((resolve,reject)=>{const r=db.transaction('data','readonly').objectStore('data').get('event');r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function idbPut(db,data){return new Promise((resolve,reject)=>{const tx=db.transaction('data','readwrite');tx.objectStore('data').put(data,'event');tx.oncomplete=()=>resolve();tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
function lsGet(){try{const v=localStorage.getItem(KEY);return v?JSON.parse(v):null}catch(e){return null}}
function lsPut(v){try{localStorage.setItem(KEY,JSON.stringify(v));return true}catch(e){return false}}
async function loadLocal(){let a=lsGet(),b=null;try{dbOffline=await idbOpen();b=await idbGet(dbOffline)}catch(e){dbOffline=null}
const chosen=a&&b?(Number(a.updatedAt)>=Number(b.updatedAt)?a:b):(a||b);
if(!chosen){const raw=(()=>{try{return localStorage.getItem(KEY)}catch(e){return null}})();if(raw!==null)throw Error('Não foi possível ler os dados já salvos. Não cadastre novos convidados antes de recuperar seu backup.');localState=defaultState()}else localState=normalizeState(chosen);
guests=localState.guests;price=localState.price;
// Equaliza os dois meios de armazenamento quando possível, sem apagar dados.
if(localState.guests.length||chosen)await persistLocal(localState);
}
async function persistLocal(next){let a=lsPut(next),b=false;if(dbOffline){try{await idbPut(dbOffline,next);b=true}catch(e){}}
if(!a&&!b)throw Error('Não foi possível gravar no celular. Verifique o modo privado ou as permissões do navegador.');}
async function updateLocal(fn){const draft=JSON.parse(JSON.stringify(localState));fn(draft);draft.updatedAt=Math.max(Date.now(),localState.updatedAt+1);await persistLocal(draft);localState=draft;guests=draft.guests;price=draft.price;render()}
const col=()=>remote.collection('guests');
async function addGuest(g){if(mode==='cloud')await col().add(g);else await updateLocal(s=>s.guests.push({...g,id:uniqueId()}))}
async function updateGuest(id,patch){if(mode==='cloud')await col().doc(id).update(patch);else await updateLocal(s=>{const g=s.guests.find(g=>g.id===id);if(!g)throw Error('Convidado não encontrado');Object.assign(g,patch)})}
async function deleteGuest(id){if(mode==='cloud')await col().doc(id).delete();else await updateLocal(s=>{s.guests=s.guests.filter(g=>g.id!==id)})}
async function savePrice(v){if(mode==='cloud')await remote.doc('settings/event').set({price:v});else await updateLocal(s=>{s.price=v})}
function personStatus(g){if(g.checkedInAt)return `<span class="chip ok">Entrou${time(g.checkedInAt)?' às '+time(g.checkedInAt):''}</span>`;if(g.type==='excedente')return g.paid?'<span class="chip ok">Pago · aguarda entrada</span>':'<span class="chip warn">Pagamento pendente</span>';return '<span class="chip">Aguardando</span>'}
function stat(v,title,extra=''){return `<div class="stat ${extra}"><strong>${v}</strong><span>${title}</span></div>`}
function renderStats(){const confirm=guests.filter(g=>g.type!=='excedente'),extra=guests.filter(g=>g.type==='excedente'),inConfirm=confirm.filter(g=>g.checkedInAt).length,inside=guests.filter(g=>g.checkedInAt).length,paid=extra.filter(g=>g.paid);$('#stats').innerHTML=stat(confirm.length,'Confirmados')+stat(inside,'Total dentro','highlight')+stat(extra.length,'Excedentes')+stat(money(paid.reduce((s,g)=>s+Number(g.amount||0),0)),'Arrecadado','money-stat')+`<p class="stat-note">Confirmados que entraram: <b>${inConfirm}</b> · Ainda faltam: <b>${confirm.length-inConfirm}</b> · Excedentes pagos: <b>${paid.length}</b> · Pendentes: <b>${extra.length-paid.length}</b></p>`}
function renderTabs(){document.querySelectorAll('[data-tab]').forEach(el=>{const is=el.dataset.tab===tab;el.classList.toggle('active',is);el.setAttribute('aria-current',is?'page':'false')})}
function gateView(){return `<section class="panel"><h2>Portaria</h2><p class="sub">Busque o nome e registre a entrada. Os convidados continuam salvos após atualizar a página.</p><label class="label" for="gate-search">Buscar convidado</label><input id="gate-search" class="search" type="search" autocomplete="off" placeholder="Digite o nome..." value="${esc(gateQuery)}"><div class="section-head"><span class="count" id="gate-count"></span></div><div id="gate-rows"></div></section>`}
function gateItem(g){let actions='';if(g.checkedInAt){actions=`<button type="button" class="soft small" data-action="undo" data-id="${esc(g.id)}">Desfazer entrada</button>`}else if(g.type==='excedente'&&!g.paid){actions=`<button type="button" class="primary small" data-action="pay" data-id="${esc(g.id)}">Pago e liberar</button>`}else{actions=(g.type==='confirmado'?`<input class="wrist" inputmode="numeric" id="band-${esc(g.id)}" aria-label="Pulseira de ${esc(g.name)}" placeholder="Nº pulseira" maxlength="22">`:'')+`<button type="button" class="primary small" data-action="checkin" data-id="${esc(g.id)}">Liberar entrada</button>`}
return `<article class="person"><div class="person-main"><b>${esc(g.name)}</b><div class="details">${g.type==='excedente'?'<span class="chip extra">Excedente</span>':''}${personStatus(g)}${g.type==='excedente'?`<span>${money(g.amount)}</span>`:''}${g.wristband?`<span>Pulseira: ${esc(g.wristband)}</span>`:''}</div></div><div class="actions">${actions}</div></article>`}
function updateGateRows(){const nq=norm(gateQuery);const rows=guests.filter(g=>!nq||norm(g.name).includes(nq)).sort((a,b)=>Number(!!a.checkedInAt)-Number(!!b.checkedInAt)||a.name.localeCompare(b.name,'pt-BR'));$('#gate-count').textContent=rows.length+' '+(rows.length===1?'resultado':'resultados');let h=rows.map(gateItem).join('');if(!rows.length)h=`<div class="empty">${nq?'Nenhum convidado com esse nome.':'Ainda não há convidados cadastrados.'}</div>`;
if(nq&&!guests.some(g=>norm(g.name)===nq)){h+=`<button type="button" class="extra-link" data-action="extra-from-search">+ Cadastrar “${esc(clean(gateQuery))}” como excedente</button>`}
$('#gate-rows').innerHTML=h}
function listView(){return `<section class="panel"><h2>Convidados confirmados</h2><p class="sub">Cadastre os nomes sem substituir ou apagar os anteriores.</p><form id="form-guest"><label for="guest-name" class="label">Nome do convidado</label><div class="form-line"><div class="field"><input id="guest-name" name="name" autocomplete="off" maxlength="120" placeholder="Nome completo" required></div><button type="submit" class="primary">+ Adicionar</button></div></form><details><summary>Adicionar vários nomes de uma vez</summary><div class="interior"><form id="form-bulk"><label for="bulk-names" class="label">Um convidado por linha</label><textarea id="bulk-names" placeholder="Maria Silva&#10;João Santos"></textarea><button type="submit" class="soft full">Adicionar nomes à lista</button></form><p class="hint">Nomes repetidos não são adicionados novamente.</p></div></details></section><section class="panel"><div class="section-head"><h3>Lista cadastrada</h3><span id="list-count" class="count"></span></div><label for="list-search" class="sr-only">Filtrar nomes</label><input id="list-search" type="search" autocomplete="off" placeholder="Filtrar nomes..." value="${esc(listQuery)}"><div id="list-rows"></div></section>`}
function listItem(g){return `<article class="person"><div class="person-main"><b>${esc(g.name)}</b><div class="details">${personStatus(g)}</div></div><div class="actions"><button type="button" class="danger small" data-action="delete" data-id="${esc(g.id)}">Excluir</button></div></article>`}
function updateListRows(){const arr=guests.filter(g=>g.type!=='excedente'&&(!listQuery||norm(g.name).includes(norm(listQuery)))).sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));$('#list-count').textContent=arr.length+' '+(arr.length===1?'nome':'nomes');$('#list-rows').innerHTML=arr.map(listItem).join('')||'<div class="empty">Nenhum convidado encontrado.</div>'}
function extView(){return `<section class="panel"><h2>Cadastrar excedente</h2><p class="sub">Agora cada excedente tem <b>nome</b>, <b>valor</b> e situação do pagamento.</p><form id="form-extra"><div class="field"><label class="label" for="extra-name">Nome do excedente</label><input id="extra-name" name="name" autocomplete="off" maxlength="120" placeholder="Nome completo" value="${esc(extraPrefill)}" required></div><div class="field"><label class="label" for="extra-amount">Valor cobrado (R$)</label><input id="extra-amount" type="text" inputmode="decimal" placeholder="Ex.: 30,00" value="${price?String(price).replace('.',','):''}" required></div><div class="checkbox-line"><input type="checkbox" id="extra-paid"><label for="extra-paid">Pagamento já recebido</label></div><button class="primary full" type="submit">+ Cadastrar excedente</button></form><p class="hint">O cadastro não registra a entrada automaticamente. Para liberar, use a aba Portaria.</p><div class="divider"></div><form id="form-price"><label class="label" for="default-price">Valor padrão do excedente (R$)</label><div class="form-line"><div class="field"><input type="text" inputmode="decimal" id="default-price" value="${price?String(price).replace('.',','):'0,00'}" placeholder="0,00"></div><button type="submit" class="soft">Salvar valor</button></div></form></section><section class="panel"><div class="section-head"><h3>Excedentes cadastrados</h3><span class="count" id="ext-count"></span></div><label for="extra-search" class="sr-only">Filtrar excedentes</label><input id="extra-search" type="search" autocomplete="off" placeholder="Buscar excedente..." value="${esc(extQuery)}"><div id="ext-rows"></div></section>`}
function extItem(g){const action=g.paid?'':`<button type="button" class="primary small" data-action="mark-paid" data-id="${esc(g.id)}">Marcar pago</button>`;return `<article class="person"><div class="person-main"><b>${esc(g.name)}</b><div class="details">${personStatus(g)}<span>${money(g.amount)}</span></div></div><div class="actions">${action}<button type="button" class="danger small" data-action="delete" data-id="${esc(g.id)}">Excluir</button></div></article>`}
function updateExtRows(){const arr=guests.filter(g=>g.type==='excedente'&&(!extQuery||norm(g.name).includes(norm(extQuery)))).sort((a,b)=>Number(a.paid)-Number(b.paid)||a.name.localeCompare(b.name,'pt-BR'));$('#ext-count').textContent=arr.length+' '+(arr.length===1?'nome':'nomes');$('#ext-rows').innerHTML=arr.map(extItem).join('')||'<div class="empty">Nenhum excedente cadastrado.</div>'}
function render(){renderStats();renderTabs();$('#view').innerHTML=tab==='gate'?gateView():tab==='list'?listView():extView();if(tab==='gate')updateGateRows();if(tab==='list')updateListRows();if(tab==='ext')updateExtRows()}
function setTab(next){tab=next;render();window.scrollTo({top:0,behavior:'instant'})}
function haveName(name){return guests.some(g=>norm(g.name)===norm(name))}
function makeGuest(name,type,amount=0,paid=false){return {name:clean(name),type,amount,paid,checkedInAt:null,wristband:'',createdAt:stamp()}}
async function withBusy(fn){if(busy)return;busy=true;try{await fn()}catch(e){console.error(e);alertToast(e.message||'Não foi possível salvar os dados.',true)}finally{busy=false}}
async function addNames(names){let known=new Set(guests.map(g=>norm(g.name))),unique=[];for(const n of names){const name=clean(n);if(!name||known.has(norm(name)))continue;known.add(norm(name));unique.push(makeGuest(name,'confirmado'))}
if(!unique.length){alertToast('Os nomes informados já estão cadastrados.',true);return}
if(mode==='cloud'){for(const g of unique)await addGuest(g)}else await updateLocal(s=>{for(const g of unique)s.guests.push({...g,id:uniqueId()})});alertToast(`${unique.length} ${unique.length===1?'convidado adicionado':'convidados adicionados'} com sucesso.`);if(mode==='cloud')setTimeout(render,300)}
document.addEventListener('input',e=>{if(e.target.id==='gate-search'){gateQuery=e.target.value;updateGateRows()}if(e.target.id==='list-search'){listQuery=e.target.value;updateListRows()}if(e.target.id==='extra-search'){extQuery=e.target.value;updateExtRows()}});
document.addEventListener('submit',e=>{const f=e.target;if(!['form-guest','form-bulk','form-extra','form-price'].includes(f.id))return;e.preventDefault();void withBusy(async()=>{
if(f.id==='form-guest'){const name=clean($('#guest-name').value);if(!name)return;if(haveName(name))throw Error('Este nome já está cadastrado.');await addNames([name]);if(mode==='local'){$('#guest-name').value='';$('#guest-name').focus()}else setTab('list')}
if(f.id==='form-bulk'){const names=$('#bulk-names').value.split(/\r?\n/);await addNames(names);if(mode==='local'){$('#bulk-names').value=''}else setTab('list')}
if(f.id==='form-extra'){const name=clean($('#extra-name').value),amount=parseAmount($('#extra-amount').value),paid=$('#extra-paid').checked;if(!name)throw Error('Informe o nome do excedente.');if(haveName(name))throw Error('Este nome já está cadastrado.');if(amount===null)throw Error('Informe um valor válido para o excedente.');await addGuest(makeGuest(name,'excedente',amount,paid));extraPrefill='';if(mode==='local')render();else setTab('ext');alertToast('Excedente cadastrado com sucesso.')}
if(f.id==='form-price'){const v=parseAmount($('#default-price').value);if(v===null)throw Error('Informe um valor válido.');await savePrice(v);if(mode==='cloud')render();alertToast('Valor padrão salvo.')}
})});
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-action]');if(!t)return;if(t.dataset.tab){setTab(t.dataset.tab);return}const act=t.dataset.action,id=t.dataset.id;void withBusy(async()=>{
if(act==='extra-from-search'){extraPrefill=clean(gateQuery);setTab('ext');$('#extra-name')?.focus();return}
if(act==='export'){exportBackup();return}
if(act==='import'){$('#file-import').click();return}
const g=guests.find(x=>x.id===id);if(!g)throw Error('Este registro não foi encontrado.');
if(act==='delete'){if(!confirm('Excluir “'+g.name+'” da lista? Esta ação não poderá ser desfeita sem um backup.'))return;await deleteGuest(id);alertToast('Convidado excluído.');return}
if(act==='checkin'){const wrist=$('#band-'+CSS.escape(id))?.value||'';await updateGuest(id,{checkedInAt:stamp(),wristband:clean(wrist)});alertToast('Entrada registrada.');return}
if(act==='undo'){if(!confirm('Desfazer a entrada de “'+g.name+'”?'))return;await updateGuest(id,{checkedInAt:null,wristband:''});alertToast('Entrada desfeita.');return}
if(act==='pay'){await updateGuest(id,{paid:true,checkedInAt:stamp()});alertToast('Pagamento e entrada registrados.');return}
if(act==='mark-paid'){await updateGuest(id,{paid:true});alertToast('Pagamento registrado.');return}
})});
function exportBackup(){const data={format:'confra-jsp-backup',version:2,exportedAt:stamp(),price,guests:guests.map(g=>({...g}))};const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='CONFRA_JSP_BACKUP_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);alertToast('Backup gerado. Guarde o arquivo em local seguro.')}
$('#file-import').addEventListener('change',e=>{const file=e.target.files?.[0];e.target.value='';if(!file)return;void withBusy(async()=>{
if(file.size>5_000_000)throw Error('O backup é grande demais (limite: 5 MB).');let data;try{data=JSON.parse(await file.text())}catch(e){throw Error('O arquivo não é um JSON válido.')}
if(!data||!Array.isArray(data.guests))throw Error('Este arquivo não contém uma lista de convidados válida.');if(data.guests.length>10000)throw Error('Backup com registros demais.');let known=new Set(guests.map(g=>norm(g.name))),incoming=[];
for(const g of data.guests){if(!g||typeof g.name!=='string')continue;const name=clean(g.name).slice(0,120);if(!name||known.has(norm(name)))continue;known.add(norm(name));incoming.push({name,type:g.type==='excedente'?'excedente':'confirmado',paid:!!g.paid,amount:Number(g.amount)||0,checkedInAt:typeof g.checkedInAt==='string'?g.checkedInAt:null,wristband:typeof g.wristband==='string'?g.wristband.slice(0,22):'',createdAt:typeof g.createdAt==='string'?g.createdAt:stamp()})}
if(!incoming.length){alertToast('Todos os nomes desse backup já estão cadastrados.');return}
if(!confirm('Importar '+incoming.length+' convidados novos? Nenhum nome existente será excluído.'))return;
if(mode==='cloud'){for(const g of incoming)await addGuest(g)}else await updateLocal(s=>{for(const g of incoming)s.guests.push({...g,id:uniqueId()})});alertToast(incoming.length+' convidados recuperados do backup.');if(mode==='cloud')setTimeout(render,300)
})});
window.addEventListener('storage',e=>{if(mode!=='local'||e.key!==KEY||!e.newValue)return;try{const next=normalizeState(JSON.parse(e.newValue));if(next.updatedAt>localState.updatedAt){localState=next;guests=next.guests;price=next.price;render();alertToast('Lista atualizada de outra aba.')}}catch(err){}});
async function init(){let cloud=null;if(window.claude&&typeof window.claude.use==='function'){try{const d=await window.claude.use('db');if(d&&typeof d.collection==='function')cloud=d}catch(e){console.warn('Banco do Claude indisponível; usando armazenamento local.',e)}}
if(cloud){mode='cloud';remote=cloud;$('#storage-state').innerHTML='<span class="dot"></span><strong>Dados na nuvem do Claude</strong> · Atualizações sincronizadas';$('#storage-notice').textContent='Este modo utiliza a base de convidados do projeto original no Claude. Baixe um backup para ter uma cópia fora da plataforma.';render();col().onSnapshot(snapshot=>{guests=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));render()},err=>alertToast('Erro ao carregar convidados: '+err.message,true));remote.doc('settings/event').onSnapshot(s=>{price=s.exists?Number(s.data().price)||0:0;if(document.activeElement?.id!=='default-price')render()},err=>alertToast('Falha ao carregar valor: '+err.message,true));return}
try{await loadLocal();mode='local';$('#storage-state').innerHTML='<span class="dot"></span><strong>Salvo neste aparelho</strong> · Os nomes permanecem após atualizar';$('#storage-notice').textContent='Os cadastros são salvos neste navegador e aparelho, mesmo após recarregar ou fechar a página. Não sincronizam entre outros celulares. Limpar os dados do navegador, usar modo anônimo ou abrir em outro aplicativo pode fazer a lista desaparecer. Faça backups regularmente.';render()}catch(e){console.error(e);$('#storage-state').textContent='Não foi possível abrir o armazenamento';$('#view').innerHTML=`<div class="alert">${esc(e.message)} Não faça novos cadastros nesta sessão. Você pode tentar recuperar o arquivo por meio do backup.</div>`;$('#storage-notice').textContent='Falha ao abrir os dados locais.';alertToast('Falha na leitura dos dados locais.',true)}}
init();
</script>
</body></html>
